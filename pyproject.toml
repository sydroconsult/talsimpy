[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "talsimpy"
dynamic = ["version"]
description = "Python interface for Talsim datasets, databases, scenarios, simulation runs and time series processing."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "SYDRO Consult GmbH", email = "mail@sydro.de" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "pandas",
]

[project.optional-dependencies]
plot = ["matplotlib"]
raster = ["xarray", "rioxarray"]

[dependency-groups]
test = ["pytest"]
docs = ["sphinx"]

[project.urls]
Homepage = "https://github.com/sydroconsult/talsimpy"
Documentation = "https://sydroconsult.github.io/talsimpy/"
Changelog = "https://github.com/sydroconsult/talsimpy/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/talsimpy/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/talsimpy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
